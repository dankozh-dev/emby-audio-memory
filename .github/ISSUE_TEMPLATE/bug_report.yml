name: Bug report
description: Report an audio selection or plugin problem.
title: '[Bug] '
labels: []
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin, Emby Server, and player app versions.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Expected result, actual result, and steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: streams
    attributes:
      label: Relevant audio tracks
      description: For two affected episodes, include audio index, title, and language. Remove usernames, tokens, file paths, and server addresses.
  - type: checkboxes
    id: settings
    attributes:
      label: Configuration
      options:
        - label: Audio Memory is enabled and the affected user is in AllowedUserIds.
        - label: The user's Remember audio track selection setting is enabled.
        - label: The track was switched manually during playback.
